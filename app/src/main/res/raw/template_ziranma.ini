; 自然码双拼模板（doubaoime 槽 2 反向生成）
;
; 三段格式：
;   [sheng]   声母=键        例：zh=v  ch=i  sh=u
;   [yun]     韵母=键        例：ai=l   an=j
;   [yinjie]  音节=两键编码  例：a=aa   （最高优先级，可覆盖 prefix 展开）
;
; 零声母（无音字，如 a、ai、an、ao、e、ei、o、ou 等）有两种写法，二选一或混用：
;   (A) 在 [yinjie] 里逐音节写出两键编码（音节栏优先级最高）。
;   (B) 在 [sheng] 里写  键=~  表示该键是零声母占位键，
;       例如  e=~  表示零声母统一用 e 作首键，a→ea、ai→e+ai键 等。
;       ~ 只影响展开，不与音节栏冲突：音节栏已写的仍以音节栏为准。
;
; 导入时 app 会自动补全（可在导入后弹窗中查看）：
;   - a o e i u v 这六个韵母若未写，默认映射到自身字母。
;   - 除 zh ch sh 外的单字母声母若未写，默认映射到自身字母。
;   - vn/un、ve/ue、van/uan 若只出现其一，另一个按同键补全。

